<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 – Page Not Found | SkinClue Dermatology Clinic Kottayam</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#080808">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #080808;
            color: #F5F0E8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 540px;
            padding: 48px 32px;
            background: #141414;
            border: 1px solid rgba(201, 169, 110, 0.2);
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
        }
        .logo-img {
            max-width: 200px;
            height: auto;
            margin: 0 auto 24px;
            display: block;
        }
        .code {
            font-size: 4.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #B8905A 0%, #E8D5A3 50%, #C9A96E 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            line-height: 1;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            color: #FFFFFF;
        }
        p {
            color: rgba(245, 240, 232, 0.7);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #B8905A 0%, #E8D5A3 50%, #C9A96E 100%);
            color: #080808;
            font-weight: 600;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(201, 169, 110, 0.35);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="SkinClue Hair &amp; Skin Clinic" class="logo-img">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for might have been moved or doesn't exist. Return to SkinClue's homepage for our dermatology and cosmetology services in Kottayam.</p>
        <a href="index.html" class="btn">Return to Homepage</a>
    </div>
</body>
</html>
