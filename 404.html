<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Page Not Found | SkinClue</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #080808;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo-mark {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 3rem;
    }

    .error-code {
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800;
      line-height: 1;
      color: #C9A96E;
      letter-spacing: -0.02em;
      text-shadow: 0 0 60px rgba(201, 169, 110, 0.18);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: #C9A96E;
      margin: 1.5rem auto;
      border-radius: 1px;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 1rem;
      letter-spacing: 0.03em;
    }

    p {
      font-size: 1rem;
      line-height: 1.75;
      color: #9e9e9e;
      max-width: 440px;
      margin: 0 auto 2.5rem;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      background: #C9A96E;
      color: #080808;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 3px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: #d4b87e;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    footer {
      margin-top: 4rem;
      font-size: 0.78rem;
      color: #555;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="logo-mark">SkinClue</div>

  <div class="error-code">404</div>
  <div class="divider"></div>

  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist. Return to our dermatology clinic homepage.</p>

  <a href="index.html" class="btn">Go to Homepage</a>

  <footer>SkinClue Hair &amp; Skin Clinic &mdash; Kanjikkuzhy, Kottayam, Kerala</footer>

</body>
</html>
